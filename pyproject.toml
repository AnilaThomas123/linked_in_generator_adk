[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linked-in-generator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pydantic>=2.8",
  "httpx>=0.27",
  "authlib>=1.9",
  "Pillow>=10.1",
]

[project.optional-dependencies]
adk = ["google-adk[openai]>=2.10.0,<3.0.0"]
observability = ["langsmith>=0.4", "wrapt>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]
